<main class="container">

    <h1>宅配食 診断ツール</h1>
    <p>以下の条件を選ぶと、あなたに合いそうな宅配食サービスを表示します。</p>

    <div class="card">
      <h3>目的を選んでください（複数可）</h3>
      <div id="goals" class="checks">
        <label><input type="checkbox" value="一人暮らし"> 一人暮らし</label>
        <label><input type="checkbox" value="ダイエット"> ダイエット</label>
        <label><input type="checkbox" value="糖質制限"> 糖質制限</label>
        <label><input type="checkbox" value="健康志向"> 健康志向</label>
        <label><input type="checkbox" value="時短"> 時短（手間を省きたい）</label>
        <label><input type="checkbox" value="高タンパク"> 高タンパク</label>
        <label><input type="checkbox" value="高齢者"> 親・高齢者の食事</label>
      </div>
      <p style="margin-top:12px;"><button class="btn-primary" onclick="runDiag()">診断する</button></p>
    </div>

    <div id="result" class="card" style="display:none;"></div>

    <script>
    const SERVICES = [{"id": "nosh", "name": "nosh（ナッシュ）", "tags": ["低糖質", "低塩分", "冷凍", "管理栄養士監修", "一人暮らし"], "target": ["一人暮らし", "ダイエット", "糖質制限", "時短"], "price": 492, "url": "https://nosh.jp/"}, {"id": "watami-takushoku", "name": "ワタミの宅食ダイレクト", "tags": ["冷凍", "管理栄養士監修", "低糖質対応あり", "セットプラン"], "target": ["一人暮らし", "共働き", "健康志向", "時短"], "price": null, "url": "https://watami-takushoku.com/"}, {"id": "mitsuboshi-farm", "name": "三ツ星ファーム", "tags": ["低糖質", "シェフ監修", "冷凍", "一人暮らし"], "target": ["一人暮らし", "ダイエット", "糖質制限", "おいしさ重視"], "price": null, "url": "https://mitsuboshifarm.jp/"}, {"id": "wellness-dining", "name": "ウェルネスダイニング", "tags": ["糖質制限", "カロリー制限", "管理栄養士監修", "制限食"], "target": ["糖質制限", "カロリー制限", "健康志向", "制限食"], "price": null, "url": "https://www.wellness-dining.com/"}, {"id": "shokutakubin", "name": "食宅便（日清医療食品）", "tags": ["健康", "医療食品", "冷凍", "冷蔵"], "target": ["健康志向", "高齢者", "制限食", "時短"], "price": null, "url": "https://www.shokutakubin.com/"}, {"id": "fit-food-home", "name": "FIT FOOD HOME", "tags": ["ダイエット", "カロリー制限", "高タンパク", "冷凍"], "target": ["ダイエット", "ボディメイク", "カロリー制限", "高タンパク"], "price": null, "url": ""}, {"id": "magokoro-care", "name": "まごころケア食", "tags": ["高齢者", "やわらか食", "健康", "冷凍"], "target": ["高齢者", "健康志向", "やわらかい食事", "制限食"], "price": null, "url": "https://www.magokoro-care.com/"}, {"id": "chef-muten-tukuritoki", "name": "シェフの無添つくりおき", "tags": ["無添加", "冷凍", "惣菜", "週替わり", "シェフ監修", "時短"], "target": ["健康志向", "時短", "無添加", "家族"], "price": null, "url": "https://store.tavenal.com/tsukurioki/"}, {"id": "syokurakuzen", "name": "食楽膳", "tags": ["冷凍", "惣菜", "個食", "塩分控えめ", "SOMPOグループ"], "target": ["高齢者", "塩分制限", "健康志向"], "price": null, "url": "https://shokurakuzen-sompocarefoods.com/"}, {"id": "yoshikei", "name": "ヨシケイ", "tags": ["食材宅配", "日配", "献立", "保冷", "時短"], "target": ["時短", "家族"], "price": null, "url": "https://www.yoshikei.co.jp/"}, {"id": "kenko-chokkyokubin", "name": "健康直球便", "tags": ["減塩", "冷凍", "弁当", "やわらか食", "消化にやさしい"], "target": ["高齢者", "塩分制限", "健康志向"], "price": null, "url": "https://kenko-chokkyubin.com/"}];
    function runDiag() {
      const goals = [...document.querySelectorAll('#goals input:checked')].map(x => x.value);
      if (goals.length === 0) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = '<p>目的を1つ以上選んでください。</p>';
        return;
      }
      // タグ or ターゲットとの一致数でスコアリング
      const scored = SERVICES.map(s => {
        const pool = [...(s.tags||[]), ...(s.target||[])];
        let score = 0;
        for (const g of goals) { if (pool.includes(g)) score++; }
        return { ...s, score };
      }).filter(s => s.score > 0).sort((a,b) => b.score - a.score);
      let html = '<h2>あなたにおすすめのサービス</h2>';
      if (scored.length === 0) {
        html += '<p>条件に合うサービスがまだ登録されていません。近日中に追加予定です。</p>';
      } else {
        html += '<table><tr><th>サービス</th><th>特徴</th><th>公式サイト</th></tr>';
        for (const s of scored) {
          const url = s.url || '';
          const link = url ? `<a href="${url}" target="_blank" rel="noopener">公式サイト</a>` : '<span style="color:#999">要確認</span>';
          html += `<tr><td><strong>${s.name}</strong></td><td>${(s.tags||[]).join('・')}</td><td>${link}</td></tr>`;
        }
        html += '</table>';
        html += '<p style="font-size:13px;color:#666;margin-top:12px;">※診断は簡易的なマッチングです。詳細は各サービスページをご確認ください。</p>';
      }
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = html;
    }
    </script>
    
<div class="updated">最終更新: 2026-08-26 ｜ 情報は確認時点のものであり、最新の価格・条件は必ず公式サイトをご確認ください。</div>
