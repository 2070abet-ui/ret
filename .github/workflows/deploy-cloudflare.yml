# Cloudflare へのデプロイ（旧: Pages方式）
# ※本番デプロイは「Cloudflare Workers Builds（Git連携）」が担当し、pushのたびに自動実行される（現行方式）。
#    本workflowはPages時代の残骸で、本番（Workers: ret4853）とは対象が異なる。
#    本番への自動デプロイは不要のため、pushトリガーは無効化している（手動実行のみ可能）。
#    この方式を有効化する場合のみ、GitHubリポジトリのSettings→Secretsに以下を設定すること。
#    - CLOUDFLARE_API_TOKEN（Cloudflareダッシュボード→マイプロフィール→APIトークン→作成）
#    - CLOUDFLARE_ACCOUNT_ID（CloudflareダッシュボードのURL: dash.cloudflare.com/{ACCOUNT_ID}）
name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build site
        run: python tools/build.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: takushokuzukan
          directory: ./site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
